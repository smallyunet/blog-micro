name: Sync and deploy

on:
  push:
    branches:
      - main
  issue_comment:
    types:
      - created
      - edited
      - deleted
  issues:
    types:
      - opened
      - edited
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: sync-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync GitHub Issues
        run: node scripts/sync-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit synced data
        id: sync_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update microblog data [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Dispatch blog-feed rebuild
        if: steps.sync_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BLOG_FEED_DISPATCH_TOKEN }}
          SOURCE_ID: micro
          SOURCE_SHA: ${{ steps.sync_commit.outputs.source_sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "BLOG_FEED_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          gh api --method POST repos/smallyunet/blog-feed/dispatches \
            -f event_type=source_updated \
            -f "client_payload[source]=${SOURCE_ID}" \
            -f "client_payload[sha]=${SOURCE_SHA}"
